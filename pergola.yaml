version: v1
components:
  - name: app
    user: 1000
    docker:
      image: solidtime/solidtime:latest
    ports:
      - 8000
    ingresses:
      - host: solidtime
        port: 8000
    storage:
      - name: app-strg
        path: /var/www/html/storage/app
        size: 250Mi
    env:
      - name: CONTAINER_MODE
        value: http
      - name: APP_NAME
        value: solidtime
      - name: VITE_APP_NAME
        value: solidtime
      - name: APP_ENV
        value: production
      - name: APP_DEBUG
        value: "false"
      - name: TRUSTED_PROXIES
        value: "0.0.0.0/0,2000:0:0:0:0:0:0:0/3"
      - name: LOG_CHANNEL
        value: stderr_daily
      - name: LOG_LEVEL
        value: debug
      - name: DB_CONNECTION
        value: pgsql
      - name: DB_HOST
        component-ref: database
      - name: DB_PORT
        value: "5432"
      - name: DB_SSLMODE
        value: prefer
      - name: QUEUE_CONNECTION
        value: database
      - name: FILESYSTEM_DISK
        value: local
      - name: PUBLIC_FILESYSTEM_DISK
        value: public
      - name: GOTENBERG_HOST
        component-ref: gotenberg
      - name: GOTENBERG_URL
        value: "http://$(GOTENBERG_HOST):3000"
      - name: APP_KEY
        config-ref: APP_KEY
      - name: APP_DOMAIN
        config-ref: APP_DOMAIN
      - name: APP_URL
        config-ref: APP_URL
      - name: APP_FORCE_HTTPS
        config-ref: APP_FORCE_HTTPS
      - name: PASSPORT_PRIVATE_KEY
        config-ref: PASSPORT_PRIVATE_KEY
      - name: PASSPORT_PUBLIC_KEY
        config-ref: PASSPORT_PUBLIC_KEY
      - name: DB_DATABASE
        config-ref: DB_DATABASE
      - name: DB_USERNAME
        config-ref: DB_USERNAME
      - name: DB_PASSWORD
        config-ref: DB_PASSWORD
      - name: MAIL_MAILER
        config-ref: MAIL_MAILER
      - name: MAIL_HOST
        config-ref: MAIL_HOST
      - name: MAIL_PORT
        config-ref: MAIL_PORT
      - name: MAIL_ENCRYPTION
        config-ref: MAIL_ENCRYPTION
      - name: MAIL_FROM_ADDRESS
        config-ref: MAIL_FROM_ADDRESS
      - name: MAIL_FROM_NAME
        config-ref: MAIL_FROM_NAME
      - name: MAIL_USERNAME
        config-ref: MAIL_USERNAME
      - name: MAIL_PASSWORD
        config-ref: MAIL_PASSWORD
      - name: SUPER_ADMINS
        config-ref: SUPER_ADMINS

  - name: scheduler
    user: 1000
    docker:
      image: solidtime/solidtime:latest
    storage:
      - name: scheduler-strg
        path: /var/www/html/storage/app
        size: 250Mi
    env:
      - name: CONTAINER_MODE
        value: scheduler
      - name: APP_NAME
        value: solidtime
      - name: VITE_APP_NAME
        value: solidtime
      - name: APP_ENV
        value: production
      - name: APP_DEBUG
        value: "false"
      - name: TRUSTED_PROXIES
        value: "0.0.0.0/0,2000:0:0:0:0:0:0:0/3"
      - name: LOG_CHANNEL
        value: stderr_daily
      - name: LOG_LEVEL
        value: debug
      - name: DB_CONNECTION
        value: pgsql
      - name: DB_HOST
        component-ref: database
      - name: DB_PORT
        value: "5432"
      - name: DB_SSLMODE
        value: prefer
      - name: QUEUE_CONNECTION
        value: database
      - name: FILESYSTEM_DISK
        value: local
      - name: PUBLIC_FILESYSTEM_DISK
        value: public
      - name: GOTENBERG_HOST
        component-ref: gotenberg
      - name: GOTENBERG_URL
        value: "http://$(GOTENBERG_HOST):3000"
      - name: APP_KEY
        config-ref: APP_KEY
      - name: APP_DOMAIN
        config-ref: APP_DOMAIN
      - name: APP_URL
        config-ref: APP_URL
      - name: APP_FORCE_HTTPS
        config-ref: APP_FORCE_HTTPS
      - name: PASSPORT_PRIVATE_KEY
        config-ref: PASSPORT_PRIVATE_KEY
      - name: PASSPORT_PUBLIC_KEY
        config-ref: PASSPORT_PUBLIC_KEY
      - name: DB_DATABASE
        config-ref: DB_DATABASE
      - name: DB_USERNAME
        config-ref: DB_USERNAME
      - name: DB_PASSWORD
        config-ref: DB_PASSWORD
      - name: MAIL_MAILER
        config-ref: MAIL_MAILER
      - name: MAIL_HOST
        config-ref: MAIL_HOST
      - name: MAIL_PORT
        config-ref: MAIL_PORT
      - name: MAIL_ENCRYPTION
        config-ref: MAIL_ENCRYPTION
      - name: MAIL_FROM_ADDRESS
        config-ref: MAIL_FROM_ADDRESS
      - name: MAIL_FROM_NAME
        config-ref: MAIL_FROM_NAME
      - name: MAIL_USERNAME
        config-ref: MAIL_USERNAME
      - name: MAIL_PASSWORD
        config-ref: MAIL_PASSWORD
      - name: SUPER_ADMINS
        config-ref: SUPER_ADMINS

  - name: queue
    user: 1000 
    docker:
      image: solidtime/solidtime:latest
    storage:
      - name: queue-strg
        path: /var/www/html/storage/app
        size: 250Mi
    env:
      - name: CONTAINER_MODE
        value: worker
      - name: WORKER_COMMAND
        value: "php /var/www/html/artisan queue:work"
      - name: APP_NAME
        value: solidtime
      - name: VITE_APP_NAME
        value: solidtime
      - name: APP_ENV
        value: production
      - name: APP_DEBUG
        value: "false"
      - name: TRUSTED_PROXIES
        value: "0.0.0.0/0,2000:0:0:0:0:0:0:0/3"
      - name: LOG_CHANNEL
        value: stderr_daily
      - name: LOG_LEVEL
        value: debug
      - name: DB_CONNECTION
        value: pgsql
      - name: DB_HOST
        component-ref: database
      - name: DB_PORT
        value: "5432"
      - name: DB_SSLMODE
        value: prefer
      - name: QUEUE_CONNECTION
        value: database
      - name: FILESYSTEM_DISK
        value: local
      - name: PUBLIC_FILESYSTEM_DISK
        value: public
      - name: GOTENBERG_HOST
        component-ref: gotenberg
      - name: GOTENBERG_URL
        value: "http://$(GOTENBERG_HOST):3000"
      - name: APP_KEY
        config-ref: APP_KEY
      - name: APP_DOMAIN
        config-ref: APP_DOMAIN
      - name: APP_URL
        config-ref: APP_URL
      - name: APP_FORCE_HTTPS
        config-ref: APP_FORCE_HTTPS
      - name: PASSPORT_PRIVATE_KEY
        config-ref: PASSPORT_PRIVATE_KEY
      - name: PASSPORT_PUBLIC_KEY
        config-ref: PASSPORT_PUBLIC_KEY
      - name: DB_DATABASE
        config-ref: DB_DATABASE
      - name: DB_USERNAME
        config-ref: DB_USERNAME
      - name: DB_PASSWORD
        config-ref: DB_PASSWORD
      - name: MAIL_MAILER
        config-ref: MAIL_MAILER
      - name: MAIL_HOST
        config-ref: MAIL_HOST
      - name: MAIL_PORT
        config-ref: MAIL_PORT
      - name: MAIL_ENCRYPTION
        config-ref: MAIL_ENCRYPTION
      - name: MAIL_FROM_ADDRESS
        config-ref: MAIL_FROM_ADDRESS
      - name: MAIL_FROM_NAME
        config-ref: MAIL_FROM_NAME
      - name: MAIL_USERNAME
        config-ref: MAIL_USERNAME
      - name: MAIL_PASSWORD
        config-ref: MAIL_PASSWORD
      - name: SUPER_ADMINS
        config-ref: SUPER_ADMINS

  - name: database
    docker:
      image: postgres:15
    ports:
      - 5432
    storage:
      - name: database-storage
        path: /var/lib/postgresql/data
        size: 500Mi
    env:
      - name: PGPASSWORD
        config-ref: DB_PASSWORD
      - name: POSTGRES_DB
        config-ref: DB_DATABASE
      - name: POSTGRES_USER
        config-ref: DB_USERNAME
      - name: POSTGRES_PASSWORD
        config-ref: DB_PASSWORD

  - name: gotenberg
    docker:
      image: gotenberg/gotenberg:8
    ports:
      - 3000
